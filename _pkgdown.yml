url: https://awkena.github.io/panGenomeBreedr

template:
  bootstrap: 5
  bootswatch: flatly

figures:
  fig.width: 10
  fig.height: 6
  dpi: 96

home:
  title: "panGenomeBreedr"
  tagline: "Helpers for pangenome-enabled crop breeding"
  strip_header: false

